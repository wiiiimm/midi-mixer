<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>midi-mixer · Rehearsal studio</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="studio.css"></head><body>
<aside><div class="brand"><span class="logo">♫</span><div>midi-mixer<small>Rehearsal studio</small></div></div>
<button id="import" class="import">＋ Load MIDI files</button><input hidden type="file" id="upload" accept=".mid,.midi,audio/midi" multiple><input type="search" placeholder="Filter songs…" aria-label="Filter songs" id="filter">
<div class="libhead">Rehearsal playlist <span id="filecount"></span></div><nav id="files"></nav><div class="local">Imported files stay on this device.</div></aside>
<main><header class="transport"><div class="cluster"><button id="home" aria-label="Return to start">Ⅰ◀</button><button id="play">▶ Play</button><button id="click" aria-pressed="false">♩ Click</button></div>
<div class="song"><h1 id="title"></h1><small id="meta"></small></div><div class="readout"><small>BAR : BEAT</small><strong id="beatpos">1 : 1</strong></div><div class="readout"><small>TIME</small><span id="clock"></span></div>
<label>Tempo <select id="rate" aria-label="Playback speed"></select></label><div class="cluster"><button id="loop" aria-pressed="false">⟳ Loop</button><label>A <input id="a" type="number" min="1" value="1"></label><label>B <input id="b" type="number" min="1" value="4"></label></div>
<a id="popmetro" href="metronome.html" target="midiMixerMetronome">Metronome ↗</a></header>
<div class="toolbar"><label><input id="all" type="checkbox"> All tracks</label><button id="group" disabled>Mute selected</button><button id="solosel" disabled>Solo selected</button><button id="reset">Reset mix</button><div class="pager"><button id="prev" aria-label="Previous bars">‹</button><span id="bars"></span><button id="next" aria-label="Next bars">›</button></div><button id="keytoggle" aria-pressed="true">▥ Keys</button></div>
<input id="seek" type="range" min="0" step=".01" value="0" aria-label="Playback position">
<div class="workspace"><div class="lanes"><section class="strip"><h2>Track mixer</h2><table><tbody id="rows"></tbody></table></section><div id="scorewrap"><svg id="score" aria-label="Score. Click a position to start there."></svg></div></div><output id="status" role="status"></output></div>
<section class="piano"><div class="panelhead"><h2>▥　Sound check piano</h2><label>Shortcut octave <select id="octave" aria-label="Piano starting octave"></select></label></div><div class="pianoscroll"><div id="keys" aria-label="Practice piano keys"></div></div></section>
</main><script src="midi.js"></script><script src="clefs.js"></script><script src="tick.js"></script><script src="player.js"></script><script src="piano.js"></script></body></html>
