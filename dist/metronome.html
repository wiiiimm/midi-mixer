<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Metronome · midi-mixer</title><style>
*{box-sizing:border-box}body{margin:0;background:#101a2b;color:#edf4ff;font:16px system-ui;color-scheme:dark}main{max-width:400px;margin:0 auto;padding:24px}.brand{font-size:13px;font-weight:650;color:#65ccec}h1{margin:8px 0 20px;font-size:26px}.tempo{display:flex;align-items:baseline;gap:8px}.tempo input{width:112px;background:none;color:#fff;border:0;border-bottom:1px solid #35475e;font:bold 43px ui-monospace,monospace}.tempo label,small{color:#afbed0}#slider{width:100%;margin:14px 0;accent-color:#31d8a3}.controls{display:flex;gap:8px;align-items:center;margin:10px 0}select,button{background:#1d2d43;border:1px solid #43566f;color:#edf4ff;padding:8px;border-radius:6px;font:inherit}.beats{display:flex;gap:6px;margin:20px 0}.beats i{height:9px;flex:1;background:#32445d;border-radius:3px}.beats .active{background:#48dfb0}#start{background:#24cd99;color:#071b18;width:100%;font-weight:bold;cursor:pointer}.embedded main{padding:12px 16px}.embedded h1,.embedded .brand{display:none}.embedded .beats{margin:12px 0}.embedded #error:empty{display:none}</style></head>
<body><main><div class="brand">♫　midi-mixer</div><h1>Metronome</h1><div class="tempo"><input id="bpm" aria-label="Tempo in beats per minute" type="number" min="30" max="190" value="95"><label for="bpm">BPM</label></div><input id="slider" type="range" min="30" max="190" value="95" aria-label="Tempo"><div class="controls"><label for="meter">Beats per bar</label><select id="meter"><option>1</option><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select></div><div class="beats" id="lights" aria-hidden="true"></div><button id="start">▶ Start</button><p id="error" role="status"></p></main><script src="tick.js"></script><script src="metro.js"></script></body></html>
